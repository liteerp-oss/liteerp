name: Deploy Staging

on:
  push:
    branches: [ dev ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          cp -r .env.example .env
          cp -r ./app/.env.example ./app/.env
          docker compose build
          docker compose up -d

      - name: Run tests
        run: docker compose exec -T app php artisan migrate

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/staging
            git pull origin dev
            docker compose build
            docker compose up -d